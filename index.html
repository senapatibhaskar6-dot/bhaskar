<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NestFinder - PG, Private Hostels & Rental House Finder</title>
    <!-- Mobile App Settings to support Standalone Fullscreen mode -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NestFinder" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FF5A5F" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="description" content="Find verified PGs, private hostels, and rental houses with direct owner contacts and instant ₹99 tenant pass." />
    <meta property="og:title" content="NestFinder - PG, Private Hostels & Rental House Finder" />
    <meta property="og:description" content="Find verified PGs, private hostels, and rental houses with direct owner contacts and instant ₹99 tenant pass." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root">
      <!-- Instant 0-delay Splash Screen before JavaScript mounts -->
      <div id="app-native-splash" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:48px 24px;z-index:9999;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="width:100%;height:32px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
          <div style="width:96px;height:96px;border-radius:24px;padding:8px;background:rgba(255,90,95,0.06);border:1px solid #f1f5f9;box-shadow:0 12px 28px rgba(0,0,0,0.08);display:flex;align-items:center;justify-content:center;">
            <img src="/icon-192.png" alt="NestFinder" style="width:100%;height:100%;border-radius:18px;object-fit:cover;" />
          </div>
          <h1 style="margin-top:20px;font-size:26px;font-weight:800;color:#0f172a;letter-spacing:-0.5px;margin-bottom:4px;">Nest<span style="color:#FF5A5F;">Finder</span></h1>
          <p style="margin:0;font-size:13px;font-weight:600;color:#64748b;max-width:240px;">PG, Private Hostels & Rentals in Assam</p>
          <div style="margin-top:28px;display:flex;align-items:center;gap:8px;padding:6px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;">
            <div style="width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:#FF5A5F;border-radius:50%;animation:nfSpin 0.7s linear infinite;"></div>
            <span style="font-size:11px;font-weight:700;color:#475569;">Opening NestFinder...</span>
          </div>
        </div>
        <p style="font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;margin:0;">Guwahati • Jorhat • Dibrugarh • Assam</p>
        <style>
          @keyframes nfSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
